plugins {
    id 'com.android.application'
}

// The native libraries (libmain.so, libSDL3.so, libadrenotools' hooks, the Turnip driver) are built by CMake beforehand
// (tools/android/build_native.sh) into app/libs/arm64-v8a, and the shaders and fonts into app/assets; Gradle only packages.
android {
    namespace = "com.ptport.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.ptport.app"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode((project.findProperty('ptVersionCode') ?: '1') as int)
        versionName project.findProperty('ptVersionName') ?: 'dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    // One permanent key for every release, so a new APK installs over the old one and keeps the set-up game and the saves.
    // CI writes it from the repository secrets PT_KEYSTORE_B64 and PT_KEYSTORE_PASSWORD (.github/workflows/android.yml); a
    // build without them (a local one) falls back to the debug key, which differs per machine.
    def ptKeystore = file('pt-release.jks')
    signingConfigs {
        ptRelease {
            if (ptKeystore.exists()) {
                storeFile ptKeystore
                storePassword System.getenv('PT_KEYSTORE_PASSWORD')
                keyAlias 'pt'
                keyPassword System.getenv('PT_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ptKeystore.exists() ? signingConfigs.ptRelease : signingConfigs.debug
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['libs']
        assets.srcDirs = ['assets']
    }
    packagingOptions {
        jniLibs {
            // libadrenotools loads its hooks and the driver from nativeLibraryDir, so the libraries must be unpacked on install
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
