# The Android APK (docs/android.md): arm64, for Snapdragon (Adreno) handhelds and phones. Every push to android-port builds
# it; the APK is attached to the rolling "android-latest" pre-release, so it can be downloaded straight onto the device.
# A numbered release comes from android/release-version.txt: when it names a version (v0.1.0) that has no release yet, the
# build publishes android-v<version> with PT-Android-v<version>.apk and the notes in docs/android-release-notes.md. A tag
# android-v<version> pushed by hand does the same.
name: Android

on:
  push:
    branches: [android-port]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc
          cmake --version
          glslc --version
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Native build
        run: |
          set -o pipefail
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android/build_native.sh 2>&1 | tee -a build.log

      - name: APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          PT_KEYSTORE_B64: ${{ secrets.PT_KEYSTORE_B64 }}
          PT_KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # the permanent release key (android/app/build.gradle); without the secrets the APK gets the runner's debug key
          if [ -n "$PT_KEYSTORE_B64" ]; then
            echo "$PT_KEYSTORE_B64" | base64 -d > app/pt-release.jks
            echo "signing with the permanent release key"
          else
            echo "::warning::PT_KEYSTORE_B64 is not set: the APK is signed with a one-off debug key and will not update over earlier installs"
          fi
          set -o pipefail
          release=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release="${GITHUB_REF_NAME#android-}"
          elif [ -s release-version.txt ]; then
            wanted="$(tr -d ' \r\n' < release-version.txt)"
            if [ -n "$wanted" ] && ! gh release view "android-$wanted" >/dev/null 2>&1; then release="$wanted"; fi
          fi
          if [ -n "$release" ]; then version="$release"; else version="test-${{ github.run_number }}-$(git rev-parse --short HEAD)"; fi
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_RELEASE=$release" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease -PptVersionCode=${{ github.run_number }} -PptVersionName="$version" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PT-Android.apk"
          ls -la "$GITHUB_WORKSPACE/PT-Android.apk"

      - name: Build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the log as a release asset as well, readable without signing in to Actions
          [ -f build.log ] || echo "no build log" > build.log
          grep -nE "error|Error|FAILED|undefined reference|fatal" build.log | head -n 200 > build-errors.log || true
          if ! gh release view android-logs >/dev/null 2>&1; then
            gh release create android-logs --prerelease --title "Android build logs" --notes "Logs of the latest Android build." --target "$GITHUB_SHA"
          fi
          files="build.log build-errors.log"
          # the unstripped libmain.so of this build: turns the offsets in a pt-crash.txt into function names
          [ -f build/android/libmain.so ] && cp build/android/libmain.so libmain-symbols.so && files="$files libmain-symbols.so"
          gh release upload android-logs $files --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: PT-Android
          path: PT-Android.apk

      - name: Publish a numbered release
        if: env.APK_RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp PT-Android.apk "PT-Android-$APK_RELEASE.apk"
          gh release create "android-$APK_RELEASE" "PT-Android-$APK_RELEASE.apk" --prerelease --target "$GITHUB_SHA" \
            --title "P.T. for Android $APK_RELEASE (experimental)" --notes-file docs/android-release-notes.md

      - name: Publish to android-latest
        if: github.ref == 'refs/heads/android-port'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build ${{ github.run_number }} from $(git rev-parse --short HEAD). Install PT-Android.apk on an Adreno (Snapdragon) device; see docs/android.md."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest PT-Android.apk --clobber
            gh release edit android-latest --notes "$notes" --prerelease
          else
            gh release create android-latest PT-Android.apk --prerelease --title "Android test build" --notes "$notes" --target "$GITHUB_SHA"
          fi
